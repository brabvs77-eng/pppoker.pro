# Static site — Next.js export for pppoker.pro (FastPanel)
#
# IMPORTANT: FastPanel also loads
#   /etc/nginx/fastpanel2-sites/pppokerpro/pppoker.pro.includes
# That file must NOT contain another `location /` (causes:
#   [emerg] duplicate location "/" … pppoker.pro.includes).
#
# If the panel keeps a `location /` in includes, either:
#   A) clear/remove `location /` from includes, use this full file as site nginx, OR
#   B) use this file WITHOUT the `location /` / `location = /` blocks and put
#      those blocks only into includes (see pppoker.pro.includes.snippet).

server {
    server_name pppoker.pro www.pppoker.pro;
    listen 192.168.0.151:443 ssl;

    ssl_certificate "/var/www/httpd-cert/pppoker.pro_2026-01-16-20-49_18.crt";
    ssl_certificate_key "/var/www/httpd-cert/pppoker.pro_2026-01-16-20-49_18.key";

    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/css text/plain text/xml application/json application/javascript application/x-javascript image/svg+xml font/woff font/woff2;
    gzip_comp_level 5;

    set $root_path /var/www/pppokerpro/data/www/pppoker.pro;
    root $root_path;
    # disable_symlinks often causes 403 on FastPanel static sites — leave OFF
    # disable_symlinks if_not_owner from=$root_path;

    index index.html;

    # Static locations live in pppoker.pro.includes.snippet when FastPanel
    # already injects location / via includes. Uncomment below ONLY if includes
    # has no location / of its own.
    #
    # location = / {
    #     try_files /index.html =404;
    # }
    # location / {
    #     try_files $uri $uri/index.html =404;
    # }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    location /assets/ {
        expires 30d;
        try_files $uri =404;
        access_log off;
    }

    location ~* ^.+\.(jpg|jpeg|gif|png|svg|js|css|mp3|ogg|mpeg|avi|zip|gz|bz2|rar|swf|ico|7z|doc|docx|map|otf|pdf|ttf|tif|txt|wav|webp|woff|woff2|xls|xlsx|xml|webm|mp4|json)$ {
        expires 7d;
        try_files $uri =404;
        access_log off;
    }

    include "/etc/nginx/fastpanel2-sites/pppokerpro/pppoker.pro.includes";
    include /etc/nginx/fastpanel2-includes/*.conf;

    error_log /var/www/pppokerpro/data/logs/pppoker.pro-frontend.error.log;
    access_log /var/www/pppokerpro/data/logs/pppoker.pro-frontend.access.log;
}

server {
    server_name pppoker.pro www.pppoker.pro;
    listen 192.168.0.151:80;
    return 301 https://$host$request_uri;

    error_log /var/www/pppokerpro/data/logs/pppoker.pro-frontend.error.log;
    access_log /var/www/pppokerpro/data/logs/pppoker.pro-frontend.access.log;
}
