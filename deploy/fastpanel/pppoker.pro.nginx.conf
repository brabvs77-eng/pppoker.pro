# FastPanel main nginx for pppoker.pro (static Next export)
# NO location / here — it already exists in pppoker.pro.includes
# Rewrites avoid "directory index … forbidden" before includes runs.

server {
    server_name pppoker.pro www.pppoker.pro;
    listen 192.168.0.151:443 ssl;

    ssl_certificate "/var/www/httpd-cert/pppoker.pro_2026-01-16-20-49_18.crt";
    ssl_certificate_key "/var/www/httpd-cert/pppoker.pro_2026-01-16-20-49_18.key";

    http2 on;

    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/css image/x-ico application/pdf image/jpeg image/png image/gif application/javascript application/x-javascript application/x-pointplus;
    gzip_comp_level 1;

    set $root_path /var/www/pppokerpro/data/www/pppoker.pro;
    root $root_path;
    index index.html;
    disable_symlinks if_not_owner from=$root_path;

    # / и /blog/ → …/index.html (обход 403 directory index)
    rewrite ^/$ /index.html last;
    rewrite ^(.+)/$ $1/index.html last;

    location ~* ^.+\.(jpg|jpeg|gif|png|svg|js|css|mp3|ogg|mpeg|avi|zip|gz|bz2|rar|swf|ico|7z|doc|docx|map|otf|pdf|tff|tif|txt|wav|webp|woff|woff2|xls|xlsx|xml)$ {
        try_files $uri @fallback;
    }

    location @fallback {
        proxy_pass http://127.0.0.1:81;
        proxy_redirect http://127.0.0.1:81/ /;
        include /etc/nginx/proxy_params;
    }

    include "/etc/nginx/fastpanel2-sites/pppokerpro/pppoker.pro.includes";
    include /etc/nginx/fastpanel2-includes/*.conf;

    error_log /var/www/pppokerpro/data/logs/pppoker.pro-frontend.error.log;
    access_log /var/www/pppokerpro/data/logs/pppoker.pro-frontend.access.log;
}

server {
    server_name pppoker.pro www.pppoker.pro;
    listen 192.168.0.151:80;
    return 301 https://$host$request_uri;

    error_log /var/www/pppokerpro/data/logs/pppoker.pro-frontend.error.log;
    access_log /var/www/pppokerpro/data/logs/pppoker.pro-frontend.access.log;
}
