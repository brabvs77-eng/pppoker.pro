name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: 'Only SSH-diagnose FastPanel docroot (skip build/deploy)'
        type: boolean
        default: false


jobs:
  diagnose:
    name: Diagnose FastPanel
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_only == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install openssh
        run: sudo apt-get update && sudo apt-get install -y openssh-client
      - name: Diagnose docroot
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
        run: |
          chmod +x scripts/diagnose-fastpanel.sh
          ./scripts/diagnose-fastpanel.sh

  build:
    if: github.event_name != 'workflow_dispatch' || inputs.diagnose_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix apps/web ci
          npx playwright install chromium

      - name: Rudiment audit
        run: npm run audit:rudiments

      - name: Production build
        run: npm run build

      - name: Homepage smoke (Playwright)
        run: npm run smoke:homepage

      - name: Landing page smoke (Playwright)
        run: npm run smoke:landing-pages

      - name: Blog page smoke (Playwright)
        run: npm run smoke:blog-pages

      - name: Upload static export
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: apps/web/out
          retention-days: 3

  deploy:
    name: Deploy FastPanel
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.diagnose_only != true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download static export
        uses: actions/download-artifact@v4
        with:
          name: web-out
          path: apps/web/out

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Deploy to FastPanel via rsync
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
        run: |
          chmod +x scripts/deploy-fastpanel.sh
          ./scripts/deploy-fastpanel.sh

      - name: Apply static nginx config (sudo if available)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
        run: |
          chmod +x scripts/apply-fastpanel-nginx.sh
          ./scripts/apply-fastpanel-nginx.sh
