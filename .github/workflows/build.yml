name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix apps/web ci
          npx playwright install chromium

      - name: Rudiment audit
        run: npm run audit:rudiments

      - name: Production build
        run: npm run build

      - name: Homepage smoke (Playwright)
        run: npm run smoke:homepage

      - name: Landing page smoke (Playwright)
        run: npm run smoke:landing-pages

      - name: Blog page smoke (Playwright)
        run: npm run smoke:blog-pages

      - name: Upload static export
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: apps/web/out
          retention-days: 3

  deploy:
    name: Deploy FastPanel
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Download static export
        uses: actions/download-artifact@v4
        with:
          name: web-out
          path: apps/web/out

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Deploy to FastPanel via rsync
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
        run: |
          set -euo pipefail

          HOST="${DEPLOY_HOST:-95.163.222.48}"
          USER="${DEPLOY_USER:-pppokerpro}"
          PORT="${DEPLOY_PORT:-2422}"
          REMOTE_PATH="${DEPLOY_PATH:-/var/www/pppokerpro/data/www/pppoker.pro}"

          if [ -z "${SSH_KEY_B64:-}" ]; then
            echo "Missing secret SSH_KEY_B64 (base64-encoded private key) for ${USER}@${HOST}"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_KEY_B64" | tr -d '\r\n ' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Accept host key on first connect (CI); pin thereafter via known_hosts
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

          # Trailing slash: sync contents of out/ into the site document root
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${PORT} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            apps/web/out/ \
            "${USER}@${HOST}:${REMOTE_PATH}/"

          echo "Deployed apps/web/out/ → ${USER}@${HOST}:${REMOTE_PATH}/"
